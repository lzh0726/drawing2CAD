model_name_or_path: ./models/qwen3-vl-8b-instruct
trust_remote_code: false
template: qwen3_vl_nothink
flash_attn: sdpa
image_max_pixels: 262144
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: true
freeze_multi_modal_projector: true
dataset_dir: /data/luzhuohong/drawing2CAD-datasets/pilot-10k-v1/sft
dataset: drawing_train
eval_dataset: drawing_val
cutoff_len: 4096
packing: false
preprocessing_num_workers: 2
dataloader_num_workers: 2
output_dir: /data/luzhuohong/drawing2CAD-experiments/a2-10k-r16/output
overwrite_output_dir: false
logging_steps: 5
save_strategy: steps
save_steps: 25
save_total_limit: 3
save_only_model: false
report_to: none
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.0001
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
do_eval: true
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 25
prediction_loss_only: true
seed: 42
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
